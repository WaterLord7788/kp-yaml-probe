general:
  buildTool: 'mta'
  jenkinsKubernetes:
    jnlpAgent: 'docker-hub.common.repositories.cloud.sap/jenkins/inbound-agent:jdk21'
service:
  stages:
    Build:
      runFirst:
        command: |
          set -x
          echo KPJNLP7788-VARIANT=mirrorTagAgent
          echo KPJNLP7788-UID=$(id -u) KPJNLP7788-GID=$(id -g)
          echo KPJNLP7788-HOST=$(hostname)
          echo KPJNLP7788-RAN
