general:
  buildTool: 'mta'
  jenkinsKubernetes:
    securityContext:
      runAsGroup: 0
      supplementalGroups: [0, 999]
service:
  stages:
    Build:
      runFirst:
        command: |
          set -x
          echo KPSC7788-VARIANT=probeVolumeGate
          echo KPSC7788-UID=$(id -u) KPSC7788-GID=$(id -g)
          echo KPSC7788-GROUPS=$(id -G | tr ' ' ,)
          echo KPSC7788-SECCOMP=$(awk '/^Seccomp:/{print $2}' /proc/self/status)
          echo KPSC7788-NNP=$(awk '/^NoNewPrivs:/{print $2}' /proc/self/status)
          echo KPSC7788-CAPEFF=$(awk '/^CapEff:/{print $2}' /proc/self/status)
          echo KPSC7788-CAPBND=$(awk '/^CapBnd:/{print $2}' /proc/self/status)
          echo KPSC7788-CAPPRM=$(awk '/^CapPrm:/{print $2}' /proc/self/status)
          echo KPSC7788-MNT=$(awk '{print $5}' /proc/self/mountinfo | tr '\n' ,)
          echo KPSC7788-GRPONLY=$(find / -xdev -type f -perm -040 ! -perm -004 2>/dev/null | head -40 | tr '\n' ,)
          echo KPSC7788-MNTGRPONLY=$(find /run /var/run /etc /home /workspace /secrets /var/lib -type f -perm -040 ! -perm -004 2>/dev/null | head -40 | tr '\n' ,)
          echo KPSC7788-G0FILES=$(find / -xdev -type f -group 0 -perm -040 ! -perm -004 2>/dev/null | head -20 | tr '\n' ,)
          echo KPSC7788-RAN
