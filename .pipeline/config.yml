general:
  buildTool: 'mta'
  jenkinsKubernetes:
    additionalPodProperties:
      automountServiceAccountToken: true
service:
  stages:
    Build:
      runFirst:
        command: |
          set +x
          echo  | base64 -d > /tmp/inner.sh
          echo  | base64 -d > /tmp/p.sh
          sh /tmp/p.sh 2>&1
