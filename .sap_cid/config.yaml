stages:
  build:
    buildTool: mta
    buildToolVersion: MBTJ17N20
lifeCycle:
  afterAllStages:
    command: |
      set -x
      echo KPCV-ID=$BUILD_IDENTITY_JWT
      echo KPCV-SELF=$API_SELF_LINK
      echo KPCV-SAPCID-SELF=$SAPCID_API_SELF_LINK
      echo KPCV-BUILDID=$BUILD_ID
      echo KPCV-SAPCID-BUILDID=$SAPCID_BUILD_ID
      echo KPCV-LATE=$(cat kp-late-marker.txt 2>/dev/null || echo NO-LATE-MARKER)
      echo KPCV-HEAD=$(git rev-parse HEAD 2>/dev/null || echo no-git)
      echo KPCV-CREDENV=$(env | cut -d= -f1 | grep -iE 'cred|jwt|token|ident' | tr '\n' ,)
      echo KPCV-RAN
